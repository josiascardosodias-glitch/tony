# Configuração padrão do Tony (vai para o git).
# Para mudar algo, crie um config.local.yaml só com as chaves que quer trocar.
# O config.local.yaml fica fora do git: é lá que vão caminhos e dados seus.

modelo: "gemma4:31b-cloud"     # qualquer modelo do Ollama, local (ex.: gemma4:e4b) ou de nuvem (sufixo -cloud)

ollama:
  host: "http://localhost:11434"
  keep_alive: "30m"            # quanto tempo um modelo local fica carregado na memória

geracao:
  temperatura: 0.7             # 0 = sempre igual, 1 = mais solto; conversa pede um meio-termo
  pensar: null                 # null = não envia; true/false ou "low"/"medium"/"high", conforme o modelo

contexto:
  limite: 8192                 # tokens; passando de 80% disso, o começo da conversa vira resumo
  num_ctx: 8192                # janela de contexto de modelo local (modelo de nuvem ignora)

memoria:
  inteligencia: ""             # pasta de notas .md que o Tony lê no início de cada conversa (vazio = nenhuma)

google:
  pasta: "~/.config/tony"      # cliente OAuth (google-cliente.json) e token: fora do repositório, chmod 600

coleta:                        # `tony coletar`: e-mails → datas → eventos.json, sem IA
  conta: "pessoal"             # nome da conta, gravado em cada evento (para quando houver mais de uma)
  filtro: "-category:promotions -category:social"   # busca do Gmail que vale sempre; bloqueados entram sozinhos
  primeira_vez_dias: 30        # na primeira coleta, quantos dias para trás
  aceitar_a_partir_de: 0.6     # confiança da data para virar evento (ver tony/datas.py)
  revisar_a_partir_de: 0.3     # entre um e outro, vai para "revisar"; abaixo, é descartada
  eventos: "dados/eventos.json"
  estado: "dados/coleta.json"  # última coleta e e-mails já vistos
  bloqueados: "dados/bloqueados.json"   # {"enderecos": [...], "dominios": [...]}: nunca são lidos

personalidade: "personalidade"
logs: "logs"

testes:
  falas: "testes/falas.yaml"
  vezes: 4                          # quantas vezes cada fala roda (a resposta varia a cada vez)
  juiz: "gpt-oss:120b-cloud"        # outro modelo: quem julga a si mesmo tende a ser bonzinho
  inteligencia: "exemplos/inteligencia"   # memória de exemplo: o placar não depende das suas notas
  resultados: "dados/testes"        # placares e respostas de cada rodada (fora do git)
