[project]
name = "tony"
version = "5.2.1"
description = "Tony: um agente de IA pessoal, construído do zero em Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "icalendar>=7.3.0",
    "ollama>=0.6.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
tony = "tony.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
