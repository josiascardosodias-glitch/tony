[project]
name = "tony"
version = "2.0.0"
description = "Tony: um agente de IA pessoal, construído do zero em Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
tony = "tony.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
